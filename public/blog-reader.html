<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Analysis</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--felt:#1e3a2f;--felt2:#162b23;--cream:#f5f0e8;--ink:#1a1510;--ink2:#4a4035;--ink3:#8a7d6a;--gold:#c8a94a;--gold2:#e8c96a;--border2:rgba(200,169,74,0.4)}
body{font-family:'Crimson Pro',Georgia,serif;background:var(--cream);color:var(--ink);line-height:1.7;padding:0 0 80px}

.topbar{background:var(--felt);border-bottom:.5px solid var(--border2);padding:0 32px;display:flex;align-items:center;height:50px}
.brand{color:var(--gold2);font-size:18px;font-weight:300;letter-spacing:2px;text-transform:uppercase;text-decoration:none}
.back{margin-left:auto;font-size:13px;color:rgba(245,240,232,.5);text-decoration:none;font-style:italic;transition:color .15s}
.back:hover{color:var(--gold)}

.wrap{max-width:680px;margin:0 auto;padding:52px 24px}
h1{font-size:38px;font-weight:300;letter-spacing:-.5px;line-height:1.2;margin-bottom:12px}

.meta{font-size:14px;color:var(--ink3);font-style:italic;margin-bottom:40px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding-bottom:20px;border-bottom:.5px solid rgba(26,21,16,.1)}
.meta-sep{color:var(--gold)}

/* Diagram */
.diagram{background:var(--felt);border-radius:12px;padding:22px;margin:0 0 40px;display:inline-grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto auto;gap:6px 14px}
.hand-N{grid-column:2;grid-row:1;text-align:center}
.hand-W{grid-column:1;grid-row:2;text-align:right}
.hand-ctr{grid-column:2;grid-row:2;display:flex;align-items:center;justify-content:center}
.hand-E{grid-column:3;grid-row:2}
.hand-S{grid-column:2;grid-row:3;text-align:center}
.ctr-rose{width:46px;height:46px;border:.5px solid rgba(200,169,74,.35);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;color:rgba(245,240,232,.4);font-family:'Crimson Pro',serif;line-height:1.4;text-align:center}
.pos-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin-bottom:3px;font-family:'Crimson Pro',serif}
.hand-suits{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8}
.suit-row{display:flex;align-items:center;gap:5px;white-space:nowrap}
.suit-row.right{justify-content:flex-end}
.suit-row.center{justify-content:center}
.sym{width:13px;flex-shrink:0}
.S,.C{color:#f5f0e8}.H,.D{color:#e06060}
.void{color:rgba(245,240,232,.25);font-style:italic}

/* Prose */
.prose{font-size:20px;line-height:1.9;color:var(--ink)}
.prose p{margin-bottom:1.3em}
.prose strong{font-weight:600}
.prose em{font-style:italic}

.bbo-link{display:inline-block;margin-top:32px;padding:9px 20px;border:.5px solid var(--gold);border-radius:5px;color:#8a4a00;font-size:14px;text-decoration:none;font-family:'Crimson Pro',serif;letter-spacing:.3px;transition:background .15s,color .15s}
.bbo-link:hover{background:var(--gold);color:var(--felt2)}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="blog-index.html">♠ Bridge Analysis</a>
  <a class="back" href="blog-index.html">← All posts</a>
</div>
<div class="wrap" id="wrap">
  <p style="color:var(--ink3);font-style:italic;padding-top:40px">Loading…</p>
</div>
<script>
/* ═══════════════════════ FIREBASE ═══════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCem5EbVUeKJUihyEppP1iPEh6aYNNvKhc",
  authDomain: "coaching-u26.firebaseapp.com",
  databaseURL: "https://coaching-u26-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "coaching-u26",
  storageBucket: "coaching-u26.firebasestorage.app",
  messagingSenderId: "928921692411",
  appId: "1:928921692411:web:b95f23533ee39461db685e"
};

const SYM={S:'♠',H:'♥',D:'♦',C:'♣'};
const VUL={'0':'None','n':'N/S vul','e':'E/W vul','b':'Both vul'};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function hb(pos,h,align){
  const hand=h||{S:[],H:[],D:[],C:[]};
  const suits=['S','H','D','C'].map(s=>{
    const cards=hand[s]||[];
    const val=cards.length?cards.join(' '):'<span class="void">—</span>';
    return`<div class="suit-row ${align}"><span class="sym ${s}">${SYM[s]}</span><span class="${s}">${val}</span></div>`;
  }).join('');
  return`<div class="pos-lbl">${pos}</div><div class="hand-suits">${suits}</div>`;
}

function render(post){
  const dateStr=new Date(post.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const contractStr=post.contract?(post.contract+(post.declarer?' by '+post.declarer:'')):'';
  const vulStr=VUL[post.vul]||'';
  const bboUrl='https://www.bridgebase.com/tools/handviewer.html?lin='+encodeURIComponent(post.lin||'');

  const proseHtml=String(post.prose||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n\n+/g,'</p><p>')
    .replace(/\n/g,'<br>');

  document.title=post.title+' — Bridge Analysis';
  document.getElementById('wrap').innerHTML=`
    <h1>${esc(post.title)}</h1>
    <div class="meta">
      <span>${dateStr}</span>
      ${contractStr?`<span class="meta-sep">·</span><span>${contractStr}</span>`:''}
      ${vulStr&&vulStr!=='None'?`<span class="meta-sep">·</span><span>${vulStr}</span>`:''}
    </div>
    <div class="diagram">
      <div class="hand-N">${hb('N',post.hand?.N,'center')}</div>
      <div class="hand-W">${hb('W',post.hand?.W,'right')}</div>
      <div class="hand-ctr"><div class="ctr-rose">N<br>W·E<br>S</div></div>
      <div class="hand-E">${hb('E',post.hand?.E,'left')}</div>
      <div class="hand-S">${hb('S',post.hand?.S,'center')}</div>
    </div>
    <div class="prose"><p>${proseHtml}</p></div>
    ${post.lin?`<a class="bbo-link" href="${bboUrl}" target="_blank">View hand in BBO ↗</a>`:''}
  `;
}

function showError(msg){
  document.getElementById('wrap').innerHTML=`<p style="color:#8a7d6a;font-style:italic;padding-top:40px">${msg} <a href="blog-index.html" style="color:#c8a94a">Back to index</a>.</p>`;
}

/* Load post by id from Firebase. Falls back to the old hash-encoded
   format so links already shared/indexed under the old scheme still work. */
(function(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');

  function loadScript(src, cb){
    const s = document.createElement('script'); s.src = src;
    s.onload = cb; s.onerror = () => showError('Could not connect.');
    document.head.appendChild(s);
  }

  if (id) {
    loadScript('https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-app-compat.min.js', function(){
      loadScript('https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-database-compat.min.js', function(){
        try {
          if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
          firebase.database().ref('blog/posts/' + id).once('value', snap => {
            const post = snap.val();
            if (post) render(post);
            else showError('Post not found.');
          });
        } catch(e) { showError('Could not load post.'); }
      });
    });
    return;
  }

  // Legacy fallback: old links encoded the full post JSON in the hash
  const hash = window.location.hash.slice(1);
  if (hash) {
    try {
      render(JSON.parse(decodeURIComponent(hash)));
    } catch(e) {
      showError('Could not load post.');
    }
  } else {
    showError('No post specified.');
  }
})();
</script>
</body>
</html>
